<!DOCTYPE html>
<html>
<head>
<title>Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav class="navbar">
<h2>MSM Tours</h2>
</nav>

<form method="POST" class="form">

<h2>Book {{package}}</h2>

<!-- NAME -->
<input type="text" name="name" placeholder="Your Name" required>

<!-- EMAIL -->
<input type="email" name="email" placeholder="Your Email" required>

<!-- PHONE -->
<input type="tel" name="phone" placeholder="Phone Number" required pattern="[0-9]{10}">

<!-- DATE -->
<label>Select Travel Date</label>
<input type="date" name="date" required>

<!-- MESSAGE -->
<textarea name="message" placeholder="Any special request or message"></textarea>

<!-- HIDDEN PACKAGE VALUE (IMPORTANT FIX) -->
<input type="hidden" name="package" value="{{package}}">

<!-- BUTTON -->
<button type="submit">Confirm Booking</button>

</form>

</body>
</html>
